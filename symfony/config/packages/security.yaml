security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        manager_users:
            id: App\Security\ManagerUserProvider
        local_users:
            id: App\Security\TeamUserProvider
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        manager:
            pattern: ^/manager(?:/|$)
            lazy: true
            provider: manager_users
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: manager_login
                check_path: manager_login
                enable_csrf: true
                csrf_token_id: authenticate_manager
                default_target_path: manager_dashboard
            logout:
                path: manager_logout
                target: manager_login
                enable_csrf: true
        main:
            lazy: true
            provider: local_users
            entry_point: form_login
            custom_authenticators:
                - App\Security\TenantLoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: teamplaner
            logout:
                path: logout
                target: login
                enable_csrf: true
    access_control:
        - { path: ^/manager/login$, roles: PUBLIC_ACCESS }
        - { path: ^/manager, roles: ROLE_MANAGER }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/registrieren$, roles: PUBLIC_ACCESS }
        - { path: '^/[a-z0-9][a-z0-9-]{2,39}$', roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
